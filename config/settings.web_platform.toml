# Web Platform Configuration
# EC2 cloud SITL + Gazebo headless + MQTT + API
# Use: DRONE_CONFIG_FILE=config/settings.web_platform.toml

[vehicle]
backend = "ardupilot_sitl"
connection_string = "tcp:15.207.113.11:5760"
force_arm = true
vehicle_type = "copter"

[vehicle.timeouts]
connection = 30.0
arming = 60.0
takeoff = 120.0
mission = 300.0
mode_change = 10.0

[simulation]
mode = "cloud"
sitl_version = "4.8"
vehicle_type = "copter"

[simulation.gazebo]
enabled = true
world = "iris_runway"
model = "iris"
physics_rtf = 1.0
gz_version = "modern"

[logging]
level = "INFO"
format = "structured"

[mqtt]
enabled = true
host = "15.207.113.11"
port = 1883
# websocket port for browser clients: 8083 (configured in EMQX)
