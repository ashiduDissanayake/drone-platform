---
- name: Install and launch ArduPilot SITL + Gazebo Harmonic
  block:
    # ── System dependencies ────────────────────────────────────────────────
    - name: Install system dependencies
      apt:
        name:
          - git
          - python3
          - python3-pip
          - python3-dev
          - g++
          - make
          - gcc
          - screen
          - net-tools
          - psmisc
          - swig
          - curl
          - wget
        state: present
        update_cache: true
      become: true

    - name: Ensure python command exists
      command: update-alternatives --install /usr/bin/python python /usr/bin/python3 1
      become: true
      changed_when: false

    - name: Install Python packages
      pip:
        name:
          - pymavlink>=2.4.0
          - MAVProxy>=1.8.0
          - empy==3.3.4
          - pyserial
          - future
          - pexpect
          - lxml
        executable: pip3
      become: true

    # ── ArduPilot SITL binary ──────────────────────────────────────────────
    - name: Create ArduPilot directory structure
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ansible_facts['env']['HOME'] }}/ardupilot/build/sitl/bin"
        - "{{ ansible_facts['env']['HOME'] }}/ardupilot/ArduCopter"
        - "{{ ansible_facts['env']['HOME'] }}/ardupilot/Tools/autotest/default_params"

    - name: Download pre-built ArduPilot SITL binary
      get_url:
        url: https://firmware.ardupilot.org/Copter/latest/SITL_x86_64_linux_gnu/arducopter
        dest: "{{ ansible_facts['env']['HOME'] }}/ardupilot/build/sitl/bin/arducopter"
        mode: "0755"
        force: true

    - name: Download default copter parameters
      get_url:
        url: https://raw.githubusercontent.com/ArduPilot/ardupilot/master/Tools/autotest/default_params/copter.parm
        dest: "{{ ansible_facts['env']['HOME'] }}/ardupilot/Tools/autotest/default_params/copter.parm"
        force: false

    - name: Verify SITL binary
      shell: ~/ardupilot/build/sitl/bin/arducopter --version 2>&1 | head -2
      register: sitl_version
      changed_when: false

    - name: Print SITL version
      debug:
        msg: "SITL: {{ sitl_version.stdout }}"

    # ── Gazebo Harmonic + ardupilot_gazebo plugin ─────────────────────────
    - name: Install Gazebo Harmonic
      include_tasks: gazebo.yml

    # ── Unified stack runner script ────────────────────────────────────────
    # Startup order: Gazebo (opens JSON:9002) → SITL (connects JSON) → MAVProxy
    - name: Create run-stack.sh
      copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/run-stack.sh"
        mode: "0755"
        content: |
          #!/bin/bash
          # Drone Platform — SITL + Gazebo + MAVProxy stack launcher
          # Gazebo first (-s server-only, headless EC2), SITL connects to it, then MAVProxy
          # Verified working: ardupilot_gazebo plugin opens UDP 9002, SITL sends JSON to it.

          export GZ_SIM_SYSTEM_PLUGIN_PATH=$HOME/ardupilot_gazebo/build
          export GZ_SIM_RESOURCE_PATH=$HOME/ardupilot_gazebo/models:$HOME/ardupilot_gazebo/worlds

          echo "[$(date)] Stopping any existing stack..."
          pkill -9 -f arducopter 2>/dev/null || true
          pkill -9 -f mavproxy  2>/dev/null || true
          pkill -9 -f "gz sim"  2>/dev/null || true
          screen -wipe           2>/dev/null || true
          sleep 3

          # 1. Gazebo server-only (-s skips Ogre2 rendering — required for headless EC2)
          #    ArduPilotPlugin opens UDP 9002, SITL connects to it.
          echo "[$(date)] Starting Gazebo server (iris_runway world, server-only mode)..."
          screen -dmS gazebo bash -c "
            export GZ_SIM_SYSTEM_PLUGIN_PATH=\$HOME/ardupilot_gazebo/build
            export GZ_SIM_RESOURCE_PATH=\$HOME/ardupilot_gazebo/models:\$HOME/ardupilot_gazebo/worlds
            gz sim -s -v4 -r iris_runway.sdf 2>&1 | tee /tmp/gazebo.log
          "

          echo "[$(date)] Waiting for Gazebo ArduPilot plugin to open UDP 9002..."
          for i in $(seq 1 60); do
            if ss -ulnp 2>/dev/null | grep -q '9002'; then
              echo "[$(date)] ✓ Gazebo ready, UDP 9002 open (took ${i}s)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "[$(date)] WARNING: UDP 9002 not seen after 60s, continuing anyway"
            fi
            sleep 1
          done

          # 2. ArduPilot SITL — sends JSON to Gazebo UDP 9002, receives on 9003
          #    --serial0 tcp:5761 = SITL listens on TCP 5761 for MAVProxy
          echo "[$(date)] Starting ArduPilot SITL..."
          screen -dmS sitl bash -c "
            export HOME=/home/ubuntu
            cd \$HOME/ardupilot/ArduCopter
            ../build/sitl/bin/arducopter \
              -w \
              --model JSON \
              --home -35.363261,149.165230,584,353 \
              --defaults ../Tools/autotest/default_params/copter.parm \
              --serial0 tcp:5761 \
              --sim-address 127.0.0.1 \
              2>&1 | tee /tmp/sitl.log
          "

          echo "[$(date)] Waiting for SITL MAVLink port TCP 5761..."
          for i in $(seq 1 60); do
            if ss -tlnp 2>/dev/null | grep -q '5761'; then
              echo "[$(date)] ✓ SITL ready on TCP 5761 (took ${i}s)"
              sleep 5
              break
            fi
            sleep 1
          done

          # 3. MAVProxy — bridges SITL TCP 5761 → external TCP 5760
          echo "[$(date)] Starting MAVProxy..."
          screen -dmS mavproxy mavproxy.py \
            --master=tcp:127.0.0.1:5761 \
            --out=tcpin:0.0.0.0:5760

          echo "[$(date)] Waiting for MAVProxy external port TCP 5760..."
          for i in $(seq 1 30); do
            if ss -tlnp 2>/dev/null | grep -q '5760'; then
              echo "[$(date)] ✓ MAVProxy ready on TCP 5760 (took ${i}s)"
              break
            fi
            sleep 1
          done

          echo ""
          echo "=== Stack Running ==="
          echo "  Gazebo   : screen -r gazebo  | log: /tmp/gazebo.log"
          echo "  SITL     : screen -r sitl    | log: /tmp/sitl.log"
          echo "  MAVProxy : screen -r mavproxy"
          echo "  External : tcp://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null):5760"
          echo ""
          pgrep -a arducopter | head -1 | sed "s/^/  SITL:     /"
          pgrep -a mavproxy   | head -1 | sed "s/^/  MAVProxy: /"
          pgrep -a gz         | head -1 | sed "s/^/  Gazebo:   /"

    # ── Stop existing and launch ──────────────────────────────────────────
    - name: Stop any existing stack
      shell: |
        pkill -9 -f arducopter 2>/dev/null || true
        pkill -9 -f mavproxy   2>/dev/null || true
        pkill -9 -f "gz sim"   2>/dev/null || true
        screen -wipe           2>/dev/null || true
        sleep 3
      changed_when: false

    - name: Launch SITL + Gazebo + MAVProxy stack
      shell: ~/run-stack.sh
      async: 300
      poll: 0

    - name: Wait for stack startup
      pause:
        seconds: 90

    # ── Verify ────────────────────────────────────────────────────────────
    - name: Verify Gazebo is running
      shell: pgrep -a gz | head -2
      register: gz_procs
      changed_when: false
      failed_when: gz_procs.stdout == ""

    - name: Verify SITL is running
      shell: pgrep -a arducopter | head -2
      register: sitl_procs
      changed_when: false
      failed_when: sitl_procs.stdout == ""

    - name: Verify MAVProxy is listening on 5760
      shell: ss -tlnp | grep 5760
      register: mavproxy_port
      changed_when: false
      failed_when: mavproxy_port.stdout == ""

    - name: Show stack status
      debug:
        msg:
          - "Gazebo  : {{ gz_procs.stdout }}"
          - "SITL    : {{ sitl_procs.stdout }}"
          - "MAVProxy: {{ mavproxy_port.stdout }}"

  rescue:
    - debug:
        msg: "Stack setup failed. Check /tmp/gazebo.log and /tmp/sitl.log on EC2."
    - fail:
        msg: "Simulator stack setup failed"
